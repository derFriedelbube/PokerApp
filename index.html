<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pokerkasse</title>
<meta name="description" content="Poker-Abrechnung für den Spieleabend: Einsätze eintragen, Gewinner bestimmen, Split Pots automatisch aufteilen.">

<meta name="theme-color" content="#0b0f15">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">

<!-- iOS: als eigenständige App vom Home-Bildschirm starten -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pokerkasse">

<link rel="stylesheet" href="./css/styles.css">
</head>
<body>

<!-- Icon-Sprite: einmal definiert, überall per <use> referenziert -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs>
  <symbol id="i-spade" viewBox="0 0 24 24"><path d="M12 2.5C12 2.5 4 9.2 4 13.8a4 4 0 0 0 6.6 3.1L9.2 21.5h5.6l-1.4-4.6A4 4 0 0 0 20 13.8C20 9.2 12 2.5 12 2.5Z"/></symbol>
  <symbol id="i-users" viewBox="0 0 24 24"><path d="M9 11.5a3.75 3.75 0 1 0 0-7.5 3.75 3.75 0 0 0 0 7.5Zm0 1.75c-3.3 0-6.5 1.7-6.5 4v1.5c0 .55.45 1 1 1h11c.55 0 1-.45 1-1v-1.5c0-2.3-3.2-4-6.5-4Zm8.2-1.9a3.2 3.2 0 1 0-2.6-5.1 5.2 5.2 0 0 1 0 5.9c.4.2.8.3 1.3.3Zm1.3 1.9c-.6 0-1.2.06-1.75.18 1.2.95 1.95 2.2 1.95 3.62v1.5c0 .35-.06.69-.18 1h3.23c.55 0 1-.45 1-1v-1.3c0-2.2-2.4-4-4.25-4Z"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm0 2a8 8 0 1 1 0 16 8 8 0 0 1 0-16Zm-1 3v5.4l4.3 2.6.9-1.5-3.7-2.2V7Z"/></symbol>
  <symbol id="i-calc" viewBox="0 0 24 24"><path d="M5.5 2h13A2.5 2.5 0 0 1 21 4.5v15A2.5 2.5 0 0 1 18.5 22h-13A2.5 2.5 0 0 1 3 19.5v-15A2.5 2.5 0 0 1 5.5 2Zm.5 3v3h12V5H6Zm.5 6a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3Zm5.5 0a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3Zm5.5 0a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3ZM6.5 16a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3Zm5.5 0a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3Zm5.5 0a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3Z"/></symbol>
  <symbol id="i-gear" viewBox="0 0 24 24"><path d="m12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7Zm8.6-2.1.1-1.4-.1-1.4 2-1.5-2-3.4-2.3 1a7.6 7.6 0 0 0-2.4-1.4L15.5 2h-4l-.4 2.4a7.6 7.6 0 0 0-2.4 1.4l-2.3-1-2 3.4 2 1.5-.1 1.4.1 1.4-2 1.5 2 3.4 2.3-1c.7.6 1.5 1.1 2.4 1.4l.4 2.4h4l.4-2.4a7.6 7.6 0 0 0 2.4-1.4l2.3 1 2-3.4-2-1.5Z"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6V5Z"/></symbol>
  <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 11h14v2H5z"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M9 3h6l1 1.5h4V7H4V4.5h4L9 3ZM6 8.5h12l-.9 12A1.6 1.6 0 0 1 15.5 22h-7a1.6 1.6 0 0 1-1.6-1.5L6 8.5Z"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M9.6 16.6 5 12l-1.4 1.4L9.6 19.4 20.4 8.6 19 7.2Z"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M18.3 5.7 12 12l6.3 6.3-1.4 1.4L10.6 13.4 4.3 19.7 2.9 18.3 9.2 12 2.9 5.7 4.3 4.3l6.3 6.3 6.3-6.3Z" transform="translate(2.5 0)"/></symbol>
  <symbol id="i-pencil" viewBox="0 0 24 24"><path d="M3 17.2V21h3.8L18 9.8 14.2 6 3 17.2ZM20.7 6.6a1 1 0 0 0 0-1.4l-2-2a1 1 0 0 0-1.4 0l-1.6 1.6L19.1 8.2l1.6-1.6Z"/></symbol>
  <symbol id="i-share" viewBox="0 0 24 24"><path d="M12 2 7.5 6.5 8.9 7.9 11 5.8V15h2V5.8l2.1 2.1 1.4-1.4L12 2ZM5 11v9a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-9h-2v9H7v-9H5Z"/></symbol>

  <symbol id="i-money" viewBox="0 0 24 24"><path d="M3 6h18a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1Zm9 3.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5Z"/></symbol>
</defs></svg>

<header class="appbar">
  <svg class="brand-mark" aria-hidden="true"><use href="#i-spade"/></svg>
  <h1>Pokerkasse</h1>
  <button id="btn-install" class="icon-btn hidden" type="button" title="App installieren" aria-label="App installieren">
    <svg aria-hidden="true"><use href="#i-share"/></svg>
  </button>
  <button id="btn-settings" class="icon-btn" type="button" title="Einstellungen" aria-label="Einstellungen">
    <svg aria-hidden="true"><use href="#i-gear"/></svg>
  </button>
</header>

<main id="main">
  <section id="view-game"    class="view" role="tabpanel" aria-label="Spiel"></section>
  <section id="view-players" class="view hidden" role="tabpanel" aria-label="Spieler"></section>
  <section id="view-history" class="view hidden" role="tabpanel" aria-label="Verlauf"></section>
  <section id="view-cash"    class="view hidden" role="tabpanel" aria-label="Kasse"></section>
</main>

<nav class="tabbar" role="tablist">
  <button class="tab is-active" data-view="game" role="tab" type="button">
    <svg aria-hidden="true"><use href="#i-spade"/></svg><span>Spiel</span></button>
  <button class="tab" data-view="players" role="tab" type="button">
    <svg aria-hidden="true"><use href="#i-users"/></svg><span>Spieler</span></button>
  <button class="tab" data-view="history" role="tab" type="button">
    <svg aria-hidden="true"><use href="#i-clock"/></svg><span>Verlauf</span></button>
  <button class="tab" data-view="cash" role="tab" type="button">
    <svg aria-hidden="true"><use href="#i-calc"/></svg><span>Kasse</span></button>
</nav>

<div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
<div id="modal-root" class="modal-root hidden"></div>

<script src="./js/core.js"></script>
<script src="./js/app.js"></script>
</body>
</html>
