# Baut die Android-App und legt die fertige APK als Download bereit.
# Nach jedem Lauf: Actions -> den Lauf öffnen -> unter "Artifacts" die
# Datei "pokerkasse-apk" herunterladen und auf dem Handy installieren.
name: Android-App

on:
  push:
    branches:
      - claude/poker-money-tracker-app-s1l0x4
      - main
    tags:
      - 'v*'
  workflow_dispatch:

# Zum Anlegen eines Release (der Download-Link) wird Schreibrecht gebraucht.
permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Java einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Android-SDK einrichten
        uses: android-actions/setup-android@v3

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Rechenkern und Spielablauf testen
        run: npm test

      - name: Web-Dateien für die App zusammenstellen
        run: npm run www

      - name: Nach Android übernehmen
        run: npx cap sync android

      - name: APK bauen
        run: ./gradlew assembleDebug
        working-directory: android

      - name: APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: pokerkasse-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Bei einem Versions-Tag zusätzlich als Release veröffentlichen. Das ergibt
      # einen ganz normalen Download-Link, den jedes Handy direkt öffnen kann:
      # https://github.com/<benutzer>/PokerApp/releases/latest/download/pokerkasse.apk
      - name: Als Release veröffentlichen
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk pokerkasse.apk
          printf '%s\n' \
            'Android-App zum Installieren.' \
            '' \
            "**Direkter Download:** https://github.com/$REPO/releases/latest/download/pokerkasse.apk" \
            '' \
            'Auf dem Handy öffnen, bei der Rückfrage *Unbekannte Apps installieren* erlauben, dann *Installieren*. Ab Android 6.' \
            '' \
            'Die Web-App läuft weiterhin unter https://derfriedelbube.github.io/PokerApp/ – auch auf dem iPhone.' \
            > notes.md
          gh release create "$GITHUB_REF_NAME" pokerkasse.apk \
            --title "Pokerkasse $GITHUB_REF_NAME" --notes-file notes.md
