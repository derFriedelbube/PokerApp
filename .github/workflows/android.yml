# Baut die Android-App und legt die fertige APK als Download bereit.
# Nach jedem Lauf: Actions -> den Lauf öffnen -> unter "Artifacts" die
# Datei "pokerkasse-apk" herunterladen und auf dem Handy installieren.
name: Android-App

on:
  push:
    branches:
      - claude/poker-money-tracker-app-s1l0x4
      - main
  workflow_dispatch:

# Zum Anlegen eines Release (der Download-Link) wird Schreibrecht gebraucht.
permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Java einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Android-SDK einrichten
        uses: android-actions/setup-android@v3

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Rechenkern und Spielablauf testen
        run: npm test

      - name: Web-Dateien für die App zusammenstellen
        run: npm run www

      - name: Nach Android übernehmen
        run: npx cap sync android

      - name: APK bauen
        run: ./gradlew assembleDebug
        working-directory: android

      - name: APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: pokerkasse-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Bei einem Versions-Tag zusätzlich als Release veröffentlichen. Das ergibt
      # einen ganz normalen Download-Link, den jedes Handy direkt öffnen kann:
      # https://github.com/<benutzer>/PokerApp/releases/latest/download/pokerkasse.apk
      # Die fertige APK als Release bereitstellen. Das ergibt einen dauerhaften,
      # direkten Download-Link, den jedes Handy im Browser öffnen kann – ohne
      # Anmeldung und ohne Entpacken:
      #   https://github.com/<benutzer>/PokerApp/releases/latest/download/pokerkasse.apk
      # Es gibt immer genau ein Release; es wird bei jedem Build ersetzt.
      - name: Als Release veröffentlichen
        if: github.ref_name == 'main' || startsWith(github.ref_name, 'claude/')
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk pokerkasse.apk
          printf '%s\n' \
            'Die Pokerkasse als Android-App.' \
            '' \
            "**Download:** https://github.com/$REPO/releases/latest/download/pokerkasse.apk" \
            '' \
            'Die Datei auf dem Handy öffnen. Android fragt einmalig nach der Erlaubnis' \
            '*Unbekannte Apps installieren* – erlauben, dann auf *Installieren* tippen.' \
            'Voraussetzung: Android 6 oder neuer.' \
            '' \
            "Stand: Commit $GITHUB_SHA" \
            '' \
            'Auf dem iPhone gibt es die App als Web-App:' \
            'https://derfriedelbube.github.io/PokerApp/ (in Safari öffnen, Teilen, Zum Home-Bildschirm).' \
            > notes.md
          # Vorheriges Release samt Tag entfernen, damit immer genau eines
          # existiert und "latest" auf den aktuellen Stand zeigt.
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest pokerkasse.apk \
            --title "Pokerkasse für Android" --notes-file notes.md
